name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 = engines 下限 (>=20.12.0), 22 = 本番 Docker (node:22-alpine)
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # INTERVALS_* のダミー値は package.json の test スクリプトが設定済み
      - run: npm test
